# ---------------------------------------------------------------------------
# personal-blog-infra — Integracion continua (Task/021)
#
# Valida los artefactos de infraestructura que EXISTEN hoy: el Compose, los
# scripts PowerShell y Python, el historial completo de secretos y la porcion
# de S-09 que corresponde a infraestructura.
#
# `Task/025` anadio los gates de Terraform, que ya tienen algo real que mirar:
# formato, lock de proveedores en modo solo lectura, validacion de la
# configuracion, las pruebas de las guardas del laboratorio y la validacion de su
# Compose.
#
# Lo que este workflow NO hace, por decision expresa: no ejecuta `plan`, `apply`
# ni `destroy` contra el emulador. Ese ciclo se ejecuta en local durante
# `Task/025`; automatizarlo en GitHub Actions con un emulador efimero es de
# `Task/039`.
#
# La guarda de scripts de shell se conserva: sigue sin haber ninguno, y el dia
# que aparezca el primero la ejecucion falla y pide un gate de sintaxis.
# ---------------------------------------------------------------------------
name: CI Infra

on:
  push:
  pull_request:

# El workflow solo lee el repositorio: no publica, no comenta, no despliega y
# no necesita ningun secreto del proyecto.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Gitleaks y Trivy se descargan como archivo comprimido: version exacta Y
  # digest del artefacto, comprobado con `sha256sum`. Fijar solo la version
  # confiaria en que la etiqueta del release no se reescriba.
  VERSION_DE_GITLEAKS: '8.30.1'
  SHA256_DE_GITLEAKS: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
  # Misma version que ya usa el CI del backend, con el mismo digest verificado.
  VERSION_DE_TRIVY: '0.74.0'
  SHA256_DE_TRIVY: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'
  # Terraform: version exacta y digest del artefacto oficial para linux_amd64,
  # verificados contra releases.hashicorp.com. El mismo par vive en
  # scripts/laboratorio/herramientas.py y en terraform/versions.tf, y hay una
  # prueba unitaria que exige que no discrepen.
  VERSION_DE_TERRAFORM: '1.16.2'
  SHA256_DE_TERRAFORM: '0d17011f0c4664539b164b044903d04e296c86c13cb9f28040076c65cfb3985a'
  # BuildKit del builder dedicado que exporta el OCI de MinIO. Se fija por
  # DIGEST del indice multi-arquitectura, no por la etiqueta `buildx-stable-1`,
  # que es movil: el indice resuelve linux/amd64 en el runner y corresponde a
  # BuildKit v0.32.2, la MISMA version que produjo la identidad OCI verificada
  # de `Task/027.1`. Cambiar este digest puede cambiar el manifiesto resultante,
  # y `artifact.py verify` lo rechazaria.
  IMAGEN_DE_BUILDKIT: 'moby/buildkit@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8'
  BUILDER_OCI_DE_MINIO: 'minio-oci'
  IMAGEN_POSTGRES_CI: 'personal-blog-postgres:ci'
  IMAGEN_TRAEFIK_CI: 'personal-blog-traefik:ci'
  BASELINE: 'security/vulnerability-baseline.json'

jobs:
  infraestructura:
    name: Infra quality
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      # `fetch-depth: 0` no es opcional: el gate de secretos recorre TODO el
      # historial disponible, y un checkout superficial lo dejaria mirando un
      # solo commit.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Runtime versions
        run: |
          set -euo pipefail
          docker version --format 'docker {{.Client.Version}}'
          docker compose version
          python3 --version
          pwsh --version
          git --version

      # --- Terraform (Task/025) -------------------------------------------
      # Guarda inversa de la que habia antes: ahora que existen archivos `.tf`,
      # la ejecucion falla si DESAPARECEN o si el lock deja de estar versionado,
      # para que nadie retire la infraestructura dejando los gates pasando en
      # vacio.
      - name: Terraform sources exist and the lock is versioned
        run: |
          set -euo pipefail
          archivos=$(git ls-files 'terraform/**/*.tf' 'terraform/*.tf' | wc -l)
          echo "archivos .tf versionados: $archivos"
          if [ "$archivos" -eq 0 ]; then
            echo "No hay archivos Terraform: los gates de abajo no comprobarian nada."
            exit 1
          fi
          if ! git ls-files --error-unmatch terraform/.terraform.lock.hcl >/dev/null 2>&1; then
            echo "terraform/.terraform.lock.hcl NO esta versionado, y debe estarlo:"
            echo "es el archivo que fija que proveedor exacto se instala."
            exit 1
          fi
          echo "Lock de proveedores presente y versionado."

      # Version exacta Y digest, igual que Gitleaks y Trivy. Fijar solo la
      # version confiaria en que el artefacto publicado no se reescriba.
      #
      # Alcance honesto (S-09): esto demuestra IDENTIDAD y PROCEDENCIA del
      # binario. No dice nada sobre vulnerabilidades, y no se afirma que lo diga.
      - name: Install Terraform (pinned version and verified digest)
        run: |
          set -euo pipefail
          url="https://releases.hashicorp.com/terraform/${VERSION_DE_TERRAFORM}/terraform_${VERSION_DE_TERRAFORM}_linux_amd64.zip"
          curl --fail --silent --show-error --location --output /tmp/terraform.zip "$url"
          echo "${SHA256_DE_TERRAFORM}  /tmp/terraform.zip" | sha256sum --check --strict -
          unzip -q -o /tmp/terraform.zip -d /tmp/terraform
          sudo install -m 0755 /tmp/terraform/terraform /usr/local/bin/terraform
          terraform version

      - name: Terraform version agrees with versions.tf
        run: |
          set -euo pipefail
          instalada=$(terraform version -json | python3 -c 'import json,sys; print(json.load(sys.stdin)["terraform_version"])')
          echo "instalada: $instalada"
          grep -F -q "= ${VERSION_DE_TERRAFORM}" terraform/versions.tf
          echo "versions.tf exige exactamente ${VERSION_DE_TERRAFORM}"
          test "$instalada" = "$VERSION_DE_TERRAFORM"

      # El sha256 que este workflow verifica arriba debe ser EXACTAMENTE el que
      # el baseline acepta y el que fija el lanzador del laboratorio. Un control
      # negativo demostro que, sin esta comprobacion, se podia manipular el
      # baseline y el gate seguia verde: un binario suelto no lleva su identidad
      # dentro del informe de Trivy, a diferencia de una imagen con RepoDigests.
      - name: Pinned artifact identity is coherent (S-09)
        run: |
          set -euo pipefail
          python3 scripts/security/vulnerability_gate.py \
            --baseline "$BASELINE" --comprobar-coherencia .

      - name: Terraform is formatted
        run: |
          set -euo pipefail
          terraform -chdir=terraform fmt -check -recursive
          echo "Formato correcto en todos los modulos."

      # `-backend=false`: no se configura ningun backend y no se toca ningun
      # estado. `-lockfile=readonly`: el lock versionado NO se modifica, y la
      # ejecucion falla si el proveedor resuelto no es exactamente el que fija.
      - name: Terraform init (no backend, read-only lock)
        env:
          TF_IN_AUTOMATION: '1'
          CHECKPOINT_DISABLE: '1'
        run: |
          set -euo pipefail
          terraform -chdir=terraform init -backend=false -input=false -lockfile=readonly
          echo "Comprobando que el lock versionado no cambio:"
          git diff --exit-code -- terraform/.terraform.lock.hcl

      - name: Terraform validate
        env:
          TF_IN_AUTOMATION: '1'
          CHECKPOINT_DISABLE: '1'
        run: |
          set -euo pipefail
          terraform -chdir=terraform validate

      # Las guardas fail-closed del laboratorio. Ninguna de estas pruebas abre un
      # socket: los controles negativos usan entradas sinteticas y destinos
      # locales falsos.
      #
      # El ciclo plan/apply/destroy contra el emulador se ejecuta en LOCAL durante
      # Task/025. Automatizarlo aqui con un emulador efimero es Task/039.
      - name: Lab fail-closed guards
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/laboratorio -p 'test_*.py' -v

      - name: Lab Compose is valid
        run: |
          set -euo pipefail
          docker compose --file laboratorio/docker-compose.laboratorio.yml \
            --env-file laboratorio/.env.laboratorio.example config --quiet
          echo "Compose del laboratorio valido."

      # El emulador es infraestructura local privilegiada: monta el socket de
      # Docker. Su puerto NUNCA se publica fuera de loopback y su version NUNCA
      # es una etiqueta movil (controles S-01 a S-03 y S-10).
      - name: Lab emulator stays on loopback and pinned by digest
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re

          compose = open('laboratorio/docker-compose.laboratorio.yml', encoding='utf-8').read()
          ejemplo = open('laboratorio/.env.laboratorio.example', encoding='utf-8').read()

          publicados = re.findall(r'^\s*-\s*"([^"]*:\d+)"\s*$', compose, re.MULTILINE)
          print('puertos publicados:', publicados)
          if not publicados:
              raise SystemExit('No se encontro ningun puerto publicado; el gate quedaria vacio.')
          for puerto in publicados:
              if not puerto.startswith('127.0.0.1:'):
                  raise SystemExit('El laboratorio publica %r fuera de loopback.' % puerto)

          for movil in (':latest', ':nightly', ':latest-compat', ':nightly-compat'):
              if movil in compose:
                  raise SystemExit('Etiqueta movil %r en el Compose del laboratorio.' % movil)

          digest = re.search(r'^LAB_EMULADOR_DIGEST=(\S+)$', ejemplo, re.MULTILINE)
          if not digest or not re.fullmatch(r'sha256:[0-9a-f]{64}', digest.group(1)):
              raise SystemExit('LAB_EMULADOR_DIGEST no fija un digest sha256 completo.')
          print('digest del emulador:', digest.group(1))

          if '/var/run/docker.sock' not in compose:
              raise SystemExit('El emulador ya no monta el socket de Docker: revisa la topologia.')
          if 'internal: true' not in compose:
              raise SystemExit('La red de ejecucion dejo de ser internal: el perimetro desaparecio.')
          print('Loopback, digest fijado y red de ejecucion aislada.')
          PY

      - name: No shell scripts yet (add a gate before introducing one)
        run: |
          set -euo pipefail
          archivos=$(git ls-files '*.sh' '*.bash')
          if [ -n "$archivos" ]; then
            echo "Han aparecido scripts de shell:"
            echo "$archivos"
            echo "Anade un gate de sintaxis ('bash -n' como minimo) antes de integrarlos."
            exit 1
          fi
          echo "0 scripts de shell. No se declara un check para una familia inexistente."

      # --- Compose -------------------------------------------------------
      # `--env-file .env.example` cumple dos funciones: aporta las 26 variables
      # que el Compose necesita y evita cargar un `.env` que aqui no existe.
      # `--profile admin` es imprescindible: sin el, el servicio `migrations`
      # queda fuera y el gate solo cubriria 6 de los 7 servicios.
      - name: Compose is valid
        run: |
          set -euo pipefail
          servicios=$(docker compose --env-file .env.example --profile admin config --services | sort | tr '\n' ' ')
          echo "Servicios cubiertos: $servicios"
          docker compose --env-file .env.example --profile admin config --quiet
          echo "Compose valido."

      # Los contextos de `backend` y `frontend` viven en otros repositorios y
      # no existen en el runner. `config` no los necesita, pero si alguien
      # convirtiera este paso en un `build`, dejaria de funcionar: queda dicho.
      - name: Compose declares every variable it uses
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          compose = set(re.findall(r'\$\{([A-Za-z_][A-Za-z0-9_]*)', open('docker-compose.yml', encoding='utf-8').read()))
          ejemplo = set()
          for linea in open('.env.example', encoding='utf-8'):
              linea = linea.strip()
              if linea and not linea.startswith('#') and '=' in linea:
                  ejemplo.add(linea.split('=', 1)[0])
          faltan = sorted(compose - ejemplo)
          print('Variables usadas por el Compose: %d' % len(compose))
          print('Variables declaradas en .env.example: %d' % len(ejemplo))
          if faltan:
              raise SystemExit('Sin declarar en .env.example: %s' % ', '.join(faltan))
          print('Todas las variables del Compose estan declaradas.')
          PY

      # --- Scripts -------------------------------------------------------
      # El parser de PowerShell analiza, no ejecuta: ningun script de respaldo
      # o restauracion llega a tocar nada.
      - name: PowerShell scripts parse
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archivos = Get-ChildItem -Path . -Recurse -Include *.ps1,*.psm1,*.psd1 -File |
                      Where-Object { $_.FullName -notmatch '[\\/]\.git[\\/]' } |
                      Sort-Object FullName
          if ($archivos.Count -eq 0) { throw 'No se encontro ningun script PowerShell; el gate quedaria vacio.' }
          $fallos = 0
          foreach ($archivo in $archivos) {
              $tokens = $null; $errores = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile($archivo.FullName, [ref]$tokens, [ref]$errores)
              if ($errores -and $errores.Count -gt 0) {
                  $fallos++
                  Write-Output ("FALLA {0}" -f $archivo.Name)
                  foreach ($e in $errores) { Write-Output ("   {0} (linea {1})" -f $e.Message, $e.Extent.StartLineNumber) }
              } else {
                  Write-Output ("OK    {0}" -f $archivo.Name)
              }
          }
          Write-Output ("archivos={0} fallos={1}" -f $archivos.Count, $fallos)
          if ($fallos -gt 0) { exit 1 }

      # `compile()` en lugar de `compileall` para no dejar `__pycache__` en el
      # arbol de trabajo.
      - name: Python scripts compile
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib, sys
          archivos = sorted(p for p in pathlib.Path('scripts').rglob('*.py'))
          if not archivos:
              raise SystemExit('No se encontro ningun script Python; el gate quedaria vacio.')
          fallos = 0
          for archivo in archivos:
              fuente = archivo.read_text(encoding='utf-8')
              try:
                  compile(fuente, str(archivo), 'exec', dont_inherit=True)
                  print('OK    %s' % archivo)
              except SyntaxError as error:
                  fallos += 1
                  print('FALLA %s: %s (linea %s)' % (archivo, error.msg, error.lineno))
          print('archivos=%d fallos=%d' % (len(archivos), fallos))
          sys.exit(1 if fallos else 0)
          PY

      - name: Exact baseline comparator regressions
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tests/security -p 'test_*.py' -v

      # --- Secretos ------------------------------------------------------
      - name: Install Gitleaks (pinned version and verified digest)
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION_DE_GITLEAKS}/gitleaks_${VERSION_DE_GITLEAKS}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/gitleaks.tar.gz "$url"
          echo "${SHA256_DE_GITLEAKS}  /tmp/gitleaks.tar.gz" | sha256sum --check --strict -
          mkdir -p /tmp/gitleaks
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks
          sudo install -m 0755 /tmp/gitleaks/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # `--log-opts=--all` cubre cada rama y etiqueta descargadas, no solo la
      # referencia actual. `--redact=100` impide que un hallazgo imprima su
      # propio valor en un log publico.
      - name: No secrets in the full history
        run: |
          set -euo pipefail
          echo "Commits alcanzables: $(git rev-list --all --count)"
          echo "Referencias: $(git for-each-ref | wc -l)"
          gitleaks git . --log-opts="--all" --redact=100 --no-banner

      # --- S-09: vulnerabilidades de imagen -------------------------------
      - name: Install Trivy (pinned version and verified digest)
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${VERSION_DE_TRIVY}/trivy_${VERSION_DE_TRIVY}_Linux-64bit.tar.gz"
          curl --fail --silent --show-error --location --output /tmp/trivy.tar.gz "$url"
          echo "${SHA256_DE_TRIVY}  /tmp/trivy.tar.gz" | sha256sum --check --strict -
          mkdir -p /tmp/trivy
          tar -xzf /tmp/trivy.tar.gz -C /tmp/trivy
          sudo install -m 0755 /tmp/trivy/trivy /usr/local/bin/trivy
          trivy --version

      # Las imagenes propias se construyen aqui con la MISMA base fijada por
      # digest que declara `.env.example`: se escanea lo que el proyecto corre,
      # con sus parches aplicados, no la base sin parchear.
      - name: Build the project images
        run: |
          set -euo pipefail
          postgres_base="postgres:$(grep -m1 '^POSTGRES_VERSION=' .env.example | cut -d= -f2-)"
          traefik_base="traefik:$(grep -m1 '^TRAEFIK_VERSION=' .env.example | cut -d= -f2-)"
          echo "base de postgres: $postgres_base"
          echo "base de traefik : $traefik_base"
          docker build --build-arg "POSTGRES_IMAGE=${postgres_base}" -t "$IMAGEN_POSTGRES_CI" ./docker/postgres
          docker build --build-arg "TRAEFIK_IMAGE=${traefik_base}" -t "$IMAGEN_TRAEFIK_CI" ./docker/traefik

          # MinIO es un derivado reproducible de upstream, no una imagen propia
          # sujeta a tolerancia cero. Se construye sin cache, como OCI local y
          # sin publicar; el verificador exige que solo cambie /usr/bin/minio.
          #
          # El exportador OCI NO existe en el driver `docker`, que es el del
          # builder `default` del runner: contra el, este mismo comando sale con
          # «OCI exporter is not supported for the docker driver». Hace falta un
          # builder `docker-container` propio.
          #
          # Se crea SOLO para esto y NO se pasa `--use`: el builder por defecto
          # sigue siendo el `docker`, de modo que los dos `docker build` de arriba
          # conservan su comportamiento y siguen dejando sus imagenes en el daemon,
          # que es donde Trivy las busca despues.
          docker buildx create --name "$BUILDER_OCI_DE_MINIO" \
            --driver docker-container \
            --driver-opt "image=${IMAGEN_DE_BUILDKIT}" \
            --bootstrap
          docker buildx inspect "$BUILDER_OCI_DE_MINIO" | sed -n "1,10p"

          # El builder se retira pase lo que pase, SIN enmascarar el codigo de
          # salida real del build: el `trap` lo conserva y lo vuelve a emitir.
          trap 'rc=$?; docker buildx rm "$BUILDER_OCI_DE_MINIO" >/dev/null 2>&1 || true; exit $rc' EXIT

          mkdir -p /tmp/minio-oci
          docker buildx build --builder "$BUILDER_OCI_DE_MINIO" \
            --platform linux/amd64 --no-cache --pull \
            --provenance=false --sbom=false \
            --build-arg SOURCE_DATE_EPOCH=1757261589 \
            --output type=oci,dest=/tmp/minio.oci.tar,rewrite-timestamp=true \
            ./docker/minio
          python3 scripts/minio/artifact.py \
            --manifest docker/minio/build-manifest.json --root . \
            verify --oci /tmp/minio.oci.tar
          tar -xf /tmp/minio.oci.tar -C /tmp/minio-oci

      - name: Scan every infrastructure image
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-reports
          portainer="portainer/portainer-ce:$(grep -m1 '^PORTAINER_VERSION=' .env.example | cut -d= -f2-)"
          # El emulador del laboratorio se escanea por su DIGEST exacto, que es
          # tambien la identidad a la que esta ligada su aceptacion temporal.
          floci="floci/floci:2.0.1@$(grep -m1 '^LAB_EMULADOR_DIGEST=' laboratorio/.env.laboratorio.example | cut -d= -f2-)"
          escanear() {
            echo "::group::Trivy $2"
            trivy image --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL \
              --format json --output "/tmp/trivy-reports/$1.json" "$2"
            echo "::endgroup::"
          }
          escanear postgres "$IMAGEN_POSTGRES_CI"
          escanear traefik "$IMAGEN_TRAEFIK_CI"
          echo "::group::Trivy derivado MinIO"
          trivy image --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /tmp/trivy-reports/minio.json \
            --input /tmp/minio-oci
          python3 scripts/minio/artifact.py \
            --manifest docker/minio/build-manifest.json --root . \
            attest --oci /tmp/minio.oci.tar --report /tmp/trivy-reports/minio.json
          echo "::endgroup::"
          escanear portainer "$portainer"
          escanear floci "$floci"

      - name: MinIO SBOM and deterministic provenance
        run: |
          set -euo pipefail
          trivy image --format cyclonedx --output /tmp/minio-sbom.raw.json \
            --input /tmp/minio-oci
          python3 scripts/minio/artifact.py \
            --manifest docker/minio/build-manifest.json --root . \
            canonicalize-sbom --input /tmp/minio-sbom.raw.json \
            --output /tmp/minio-sbom.cyclonedx.json
          python3 scripts/minio/artifact.py \
            --manifest docker/minio/build-manifest.json --root . \
            provenance --oci /tmp/minio.oci.tar \
            --sbom /tmp/minio-sbom.cyclonedx.json \
            --output /tmp/minio-provenance.intoto.json

      # El binario de Terraform tambien entra en S-09: la norma exige versiones
      # fijadas Y escaneo, no solo lo primero. No es una imagen, asi que se
      # escanea como sistema de archivos; su identidad ya quedo verificada por
      # `sha256sum` en el paso de instalacion, y la coherencia de ese sha256 con
      # el baseline la comprueba el gate de arriba.
      - name: Scan the pinned Terraform binary
        run: |
          set -euo pipefail
          mkdir -p /tmp/trivy-terraform
          cp "$(command -v terraform)" /tmp/trivy-terraform/terraform
          echo "::group::Trivy terraform"
          trivy rootfs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /tmp/trivy-reports/terraform.json /tmp/trivy-terraform
          echo "::endgroup::"
          # El informe debe hablar del artefacto que se acepta, no de otro.
          python3 - <<'PY'
          import json
          informe = json.load(open('/tmp/trivy-reports/terraform.json', encoding='utf-8'))
          objetivos = [r.get('Target') for r in informe.get('Results') or []]
          paquetes = sum(len(r.get('Packages') or []) for r in informe.get('Results') or [])
          print('targets analizados :', objetivos)
          print('paquetes inventariados:', paquetes)
          if paquetes == 0:
              raise SystemExit(
                  'el escaneo no inventario ningun paquete del binario de Terraform. '
                  'Un informe vacio NO es "cero vulnerabilidades": es ausencia de analisis, '
                  'y el gate no puede comparar nada contra el baseline.'
              )
          PY

      # El provider oficial se escanea tambien, y NO tiene entrada de baseline:
      # su resultado es cero accionables y debe seguir siendolo. Si algun dia
      # dejara de serlo, este paso lo hara visible en el inventario y el gate
      # fallara por un accionable sin aprobar.
      - name: Scan the pinned AWS provider (no baseline entry expected)
        run: |
          set -euo pipefail
          plugin=$(find terraform/.terraform/providers -type f -name 'terraform-provider-aws*' | head -1)
          if [ -z "$plugin" ]; then
            echo "No se encontro el plugin del provider; se instala en el paso de init."
            exit 1
          fi
          mkdir -p /tmp/trivy-provider
          cp "$plugin" /tmp/trivy-provider/
          echo "::group::Trivy provider"
          trivy rootfs --scanners vuln --severity LOW,MEDIUM,HIGH,CRITICAL \
            --format json --output /tmp/trivy-reports/provider-aws.json /tmp/trivy-provider
          echo "::endgroup::"
          python3 - <<'PY'
          import json
          informe = json.load(open('/tmp/trivy-reports/provider-aws.json', encoding='utf-8'))
          paquetes = sum(len(r.get('Packages') or []) for r in informe.get('Results') or [])
          altos = [
              v for r in informe.get('Results') or []
              for v in (r.get('Vulnerabilities') or [])
              if v.get('Severity') in ('HIGH', 'CRITICAL') and v.get('FixedVersion')
          ]
          print('paquetes inventariados:', paquetes)
          print('accionables:', len(altos))
          if paquetes == 0:
              raise SystemExit('informe vacio: ausencia de analisis, no ausencia de riesgo.')
          if altos:
              for v in altos:
                  print(' -', v.get('VulnerabilityID'), v.get('PkgName'), v.get('Severity'))
              raise SystemExit(
                  'el provider tiene hallazgos accionables y NO tiene entrada de baseline. '
                  'Requiere decision humana explicita antes de aceptar cualquier residual.'
              )
          print('El provider sigue limpio y no necesita baseline.')
          PY

      # Inventario completo, sin filtrar por severidad y sin `--ignore-unfixed`:
      # incluye lo que hoy no tiene correccion publicada. No lleva `--exit-code`
      # porque es un informe; el gate real es el paso siguiente. No oculta nada.
      - name: Full vulnerability inventory (report only)
        run: |
          set -euo pipefail
          for informe in /tmp/trivy-reports/*.json; do
            nombre=$(basename "$informe" .json)
            echo "::group::Inventario de ${nombre}"
            trivy convert --scanners vuln --format table "$informe"
            echo "::endgroup::"
          done

      # Gate real y fail-closed. Tolerancia cero en las imagenes que construye
      # el proyecto; baseline de riesgo aceptado, por identidad exacta y ligado
      # al digest, en las de terceros. Sin `.trivyignore`, sin umbral por
      # cantidad y sin excluir ninguna imagen.
      - name: Image vulnerability gate (S-09)
        run: |
          set -euo pipefail
          python3 scripts/security/vulnerability_gate.py \
            --baseline "$BASELINE" \
            --reports /tmp/trivy-reports
