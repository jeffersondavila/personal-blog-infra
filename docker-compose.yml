# ---------------------------------------------------------------------------
# personal-blog-infra — Entorno local
#
# Task/003: PostgreSQL, MinIO y Portainer CE.
# Task/007: se anaden backend (FastAPI), frontend (React) y Traefik v3, que
#           integran las aplicaciones con la infraestructura ya existente.
#
# Uso exclusivamente local. Ningun servicio de este archivo se despliega en la
# nube (ver docs/adr/ADR-001-local-first.md y docs/adr/ADR-003-serverless-low-cost-cloud.md).
#
# TOPOLOGIA (Task/007)
#
#   navegador
#       |
#       v
#   Traefik v3  (unica puerta de entrada publicada)
#       |
#       +---------> frontend  React servido como estatico
#       |
#       +---------> backend   FastAPI
#                       |
#                       +----> PostgreSQL
#                       |
#                       + - -> MinIO   solo infraestructura alcanzable;
#                                      el uso aplicativo llega en Task/010
#
# CORRESPONDENCIA CON PRODUCCION (target-production-architecture.md, seccion 19)
#
#   React en Compose   -> Cloudflare Pages
#   FastAPI en Compose -> AWS Lambda (artefacto ZIP, no esta imagen)
#   MinIO              -> Amazon S3
#   PostgreSQL Docker  -> PostgreSQL en VPS, tras PgBouncer
#   Traefik v3         -> Cloudflare + API Gateway HTTP API
#   Portainer          -> nada: es solo local
#
# Requiere un archivo .env en esta misma carpeta. Copialo de .env.example.
# Los repositorios de aplicacion deben estar clonados como carpetas hermanas
# de este (ver BACKEND_CONTEXT y FRONTEND_CONTEXT en .env.example).
#
# Operacion completa: docs/runbooks/local-environment.md
# ---------------------------------------------------------------------------

name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}

services:

  # -------------------------------------------------------------------------
  # PostgreSQL — persistencia relacional del blog.
  # Solo debe ser alcanzable desde el backend (red blog-data) y desde la
  # maquina local a traves del puerto publicado en la interfaz de loopback.
  # -------------------------------------------------------------------------
  postgres:
    build:
      context: ./docker/postgres
      args:
        POSTGRES_IMAGE: postgres:${POSTGRES_VERSION}
    image: personal-blog-postgres:local
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-postgres
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${POSTGRES_BACKUP_TMP_SIZE:-128m}
      - /var/run/postgresql:rw,nosuid,nodev,uid=70,gid=70,size=8m
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Evita que un cambio de locale del host altere el ordenamiento.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
      TZ: ${TZ}
      PGTZ: ${TZ}
    ports:
      - "${LOCAL_BIND_ADDRESS}:${POSTGRES_HOST_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Area de intercambio del runbook de respaldo (`Task/018`).
      #
      # `docker cp` NO sabe leer de un montaje tmpfs: con `read_only: true` y
      # `/tmp` en RAM, `pg_dump -f /tmp/...` escribe bien y la extraccion falla
      # con "Could not find the file". Un volumen si es alcanzable, y ademas no
      # consume RAM ni queda acotado por el tamano del tmpfs.
      #
      # Es un area de PASO, no un archivo: el script borra lo que deja.
      - postgres_backup:/backup
    networks:
      - blog-data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} -h 127.0.0.1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # MinIO — almacenamiento de objetos compatible con la API de Amazon S3.
  # Equivalente local de S3. El acceso desde el backend se hara siempre a
  # traves de la interfaz ObjectStorage (Task/010).
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:${MINIO_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-minio
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=${MINIO_BACKUP_TMP_SIZE:-512m}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # mc del runbook de backup escribe su alias temporal aqui, sin modificar
      # la imagen de solo lectura ni persistir claves administrativas en /data.
      MC_CONFIG_DIR: /tmp/mc
      # La consola se publica solo en loopback; nunca en una interfaz externa.
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_HOST_PORT}
      TZ: ${TZ}
    ports:
      - "${LOCAL_BIND_ADDRESS}:${MINIO_API_HOST_PORT}:9000"
      - "${LOCAL_BIND_ADDRESS}:${MINIO_CONSOLE_HOST_PORT}:9001"
    volumes:
      - minio_data:/data
      # Mismo motivo que en PostgreSQL: `mc mirror` prepara aqui el arbol de
      # objetos y `docker cp` lo extrae. Desde un tmpfs no seria alcanzable.
      - minio_backup:/backup
    networks:
      - blog-data
    healthcheck:
      test: ["CMD", "mc", "--config-dir", "/tmp/mc-health", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Portainer CE — supervision de Docker en local.
  #
  # Reglas vigentes (docs/architecture/security-boundaries.md, seccion 4):
  #   - Solo local. Nunca se expone a internet ni a la red compartida.
  #   - No forma parte del panel administrativo del blog.
  #   - No administra contenido del blog.
  #   - El acceso al socket de Docker es privilegiado y se trata como tal.
  #
  # ADVERTENCIA DE PRIVILEGIO
  #
  # Portainer tiene acceso al daemon de Docker a traves de su socket. Eso le
  # da capacidad ADMINISTRATIVA sobre el host: puede crear, detener, eliminar
  # y modificar contenedores, redes y volumenes, incluidos los de este
  # proyecto y los de cualquier otro proyecto de la maquina.
  #
  # Vive en una red propia, aislada de blog-data, para impedir la comunicacion
  # DIRECTA por red con PostgreSQL y MinIO. Esa separacion NO limita lo que
  # Portainer puede hacer a traves del daemon: las acciones enviadas por la
  # Docker API no atraviesan la red de datos.
  #
  # El riesgo se acepta unicamente porque Portainer es local, se publica en
  # 127.0.0.1 y exige autenticacion propia. Un control real de "solo lectura"
  # sobre la API exigiria un socket proxy o una politica de autorizacion
  # adicional, fuera del alcance de Task/003.
  # -------------------------------------------------------------------------
  portainer:
    image: portainer/portainer-ce:${PORTAINER_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-portainer
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    ports:
      - "${LOCAL_BIND_ADDRESS}:${PORTAINER_HTTPS_HOST_PORT}:9443"
    volumes:
      # `:ro` aplica al ARCHIVO del socket dentro del contenedor: impide
      # sobrescribirlo o borrarlo. NO convierte la Docker API en una API de
      # solo lectura ni restringe los metodos que pueden enviarse por ella.
      # Portainer conserva capacidad administrativa sobre el daemon.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - blog-management
    # Sin healthcheck a proposito: la imagen portainer-ce es distroless
    # (su unico binario es /portainer, sin shell ni cliente HTTP), por lo que
    # no hay ningun comando ejecutable dentro del contenedor con el que
    # sondearla. Se verifica desde el host abriendo la consola HTTPS.
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Backend — FastAPI (Task/005, integrado en el Compose por Task/007).
  #
  # La imagen se construye desde `personal-blog-backend`, con el Dockerfile
  # aprobado en `Task/005`. Ese repositorio NO se modifica en `Task/007`: toda
  # la integracion se resuelve con configuracion.
  #
  # No publica ningun puerto en el host: solo es alcanzable a traves de Traefik
  # y desde la red de datos. Es la diferencia con la ejecucion suelta que
  # documenta su Dockerfile.
  # -------------------------------------------------------------------------
  backend:
    build:
      context: ${BACKEND_CONTEXT:-../personal-blog-backend}
      dockerfile: Dockerfile
    image: personal-blog-backend:local
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-backend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    env_file:
      - path: ./secrets/backend-runtime.env
        # Permite arrancar PG/MinIO antes de provisionar. El backend falla al
        # validar configuracion si faltan estas credenciales; no usa root.
        required: false
    environment:
      BLOG_APP_NAME: ${BLOG_APP_NAME:-personal-blog-backend}
      BLOG_APP_ENV: local
      BLOG_APP_DEBUG: "false"
      BLOG_LOG_LEVEL: ${BLOG_LOG_LEVEL:-INFO}
      BLOG_LOG_FORMAT: json
      BLOG_ADMIN_ALLOWED_ORIGINS: http://localhost:${TRAEFIK_HTTP_HOST_PORT}
      BLOG_AUTH_COOKIE_SECURE: "false"
      # Fail-closed local: XFF no decide la particion. Task033 fija el borde real.
      BLOG_TRUSTED_PROXY_HOP_COUNT: "0"
      # Origen publico del SITIO, no del API. Anadido por `Task/016`: lo exige
      # el sitemap (requisito E-05), que enumera URL del sitio publico.
      #
      # En local los dos coinciden porque Traefik enruta por prefijo de ruta y
      # sirve sitio y API en el mismo origen. En produccion NO coinciden
      # (D-15: sitio en el dominio raiz, API en un subdominio), y el valor real
      # lo fijan `Task/034` y `Task/035` cuando D-07 se resuelva.
      #
      # Es obligatoria y se valida al arrancar: sin ella el backend no arranca,
      # igual que sin BLOG_DATABASE_URL. Un origen inventado produciria un
      # sitemap apuntando a un sitio que no es este.
      BLOG_PUBLIC_SITE_BASE_URL: http://localhost:${TRAEFIK_HTTP_HOST_PORT}
      # DENTRO de Docker el host es el NOMBRE DEL SERVICIO y el puerto es el
      # INTERNO (5432), no el publicado en el host (55432). Apuntar aqui a
      # 127.0.0.1:55432 resolveria al propio contenedor del backend, no a
      # PostgreSQL.
      #
      # La aplicacion sigue dependiendo unicamente de DATABASE_URL: no sabe si
      # detras hay Docker, un VPS o PgBouncer (ADR-007).
      # BLOG_DATABASE_URL procede del archivo runtime, con rol sin DDL ni
      # privilegios administrativos. Migraciones conservan POSTGRES_USER.
      # Almacenamiento de objetos (`Task/010`).
      #
      # BLOG_STORAGE_BUCKET es, junto con BLOG_DATABASE_URL, uno de los dos
      # campos SIN valor por defecto: el backend no arranca sin el. Por eso
      # estas variables entran aqui y no son opcionales.
      #
      # Igual que con PostgreSQL, DENTRO de Docker el host es el NOMBRE DEL
      # SERVICIO y el puerto es el INTERNO (9000), no el publicado en el host
      # (tambien 9000, pero por 127.0.0.1). Apuntar aqui a 127.0.0.1 resolveria
      # al propio contenedor del backend, no a MinIO.
      #
      # La aplicacion no sabe que hay MinIO detras: depende de la interfaz
      # `ObjectStorage`, y estas variables son lo unico que elige la
      # implementacion (software-architecture.md 3.7).
      BLOG_STORAGE_PROVIDER: minio
      BLOG_STORAGE_BUCKET: ${BLOG_STORAGE_BUCKET:-personal-blog-media}
      BLOG_STORAGE_REGION: ${BLOG_STORAGE_REGION:-us-east-1}
      BLOG_STORAGE_ENDPOINT_URL: http://minio:9000
      # Endpoint DE ACCESO. Es el anfitrion que aparece en el enlace temporal
      # (`access_url`) que la API devuelve, y su consumidor es el NAVEGADOR DEL
      # HOST, que no resuelve el nombre de servicio `minio`.
      #
      # No es una duplicacion del de arriba: son dos direcciones distintas hacia
      # el mismo MinIO, y el backend necesita las dos.
      #
      #   backend   -> minio:9000       (red de Docker, operaciones)
      #   navegador -> localhost:9000   (puerto publicado, enlaces)
      #
      # El anfitrion entra en la firma SigV4, asi que reescribir el enlace
      # despues de firmarlo lo invalida: tiene que firmarse ya con este.
      #
      # `localhost` y no ${LOCAL_BIND_ADDRESS}: es el nombre que teclea la
      # persona en su navegador, la misma convencion que ya usa
      # MINIO_BROWSER_REDIRECT_URL. El puerto sale de la variable canonica.
      BLOG_STORAGE_ACCESS_ENDPOINT_URL: http://localhost:${MINIO_API_HOST_PORT}
      # Las claves runtime proceden de env_file; nunca se reutiliza root.
      BLOG_STORAGE_ACCESS_TTL_SECONDS: ${BLOG_STORAGE_ACCESS_TTL_SECONDS:-900}
      TZ: ${TZ}
    networks:
      - blog-data
      - blog-edge
    depends_on:
      postgres:
        # No basta con el orden de arranque: `service_healthy` espera a que
        # PostgreSQL acepte conexiones de verdad.
        condition: service_healthy
      minio:
        # Mismo criterio. El backend no falla al arrancar si MinIO no responde
        # —el cliente se crea de forma perezosa—, pero esperar a que este sano
        # evita que la primera subida de una sesion local falle sin motivo.
        condition: service_healthy
    # El healthcheck lo define el Dockerfile del backend (`Task/005`): sonda
    # HTTP contra /health con la biblioteca estandar. No se redefine aqui.
    stop_grace_period: 30s

  # -------------------------------------------------------------------------
  # Migraciones — PLANO ADMINISTRATIVO de la base de datos (`Task/018`).
  #
  # Task018 separa dos identidades que antes eran una sola:
  #
  #   runtime  -> `blog_runtime`, la del servicio `backend`. Lee y escribe el
  #               contenido del blog y NO tiene DDL, ni acceso a
  #               `alembic_version`, ni privilegios administrativos.
  #   admin    -> POSTGRES_USER, la duena del esquema. Es la unica que puede
  #               migrar, y solo se usa desde aqui.
  #
  # Sin este servicio el procedimiento de migracion no tendria donde ejecutarse:
  # `docker compose exec backend alembic ...` falla —por diseno— con
  # `permission denied for table alembic_version`.
  #
  # `profiles: [admin]` lo deja FUERA de `docker compose up`, `--wait`, `ps` y
  # `down`: solo existe cuando se le invoca de forma explicita.
  #
  #   docker compose --profile admin run --rm migrations
  #   docker compose --profile admin run --rm migrations alembic current
  #
  # Reutiliza la imagen del backend —el mismo codigo y las mismas migraciones—
  # sin publicar puertos y sin unirse a la red de borde.
  # -------------------------------------------------------------------------
  migrations:
    profiles: [admin]
    build:
      context: ${BACKEND_CONTEXT:-../personal-blog-backend}
      dockerfile: Dockerfile
    image: personal-blog-backend:local
    restart: "no"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    # La sonda del Dockerfile vigila un servidor HTTP que este contenedor no
    # levanta: aqui solo anadiria ruido de "unhealthy" a un proceso efimero.
    healthcheck:
      disable: true
    environment:
      BLOG_APP_NAME: ${BLOG_APP_NAME:-personal-blog-backend}
      BLOG_APP_ENV: local
      BLOG_APP_DEBUG: "false"
      BLOG_LOG_LEVEL: ${BLOG_LOG_LEVEL:-INFO}
      BLOG_LOG_FORMAT: json
      BLOG_PUBLIC_SITE_BASE_URL: http://localhost:${TRAEFIK_HTTP_HOST_PORT}
      # La identidad administrativa, y el unico sitio del Compose donde se usa
      # para hablar con la aplicacion. El servicio `backend` NO la recibe.
      BLOG_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Alembic no toca el almacenamiento, pero la configuracion se valida
      # entera al arrancar. Se declaran las credenciales del MISMO plano
      # administrativo —nunca las runtime— para que el procedimiento funcione
      # tambien ANTES de que existan las identidades limitadas.
      BLOG_STORAGE_PROVIDER: minio
      BLOG_STORAGE_BUCKET: ${BLOG_STORAGE_BUCKET:-personal-blog-media}
      BLOG_STORAGE_REGION: ${BLOG_STORAGE_REGION:-us-east-1}
      BLOG_STORAGE_ENDPOINT_URL: http://minio:9000
      BLOG_STORAGE_ACCESS_ENDPOINT_URL: http://localhost:${MINIO_API_HOST_PORT}
      BLOG_STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      BLOG_STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TZ: ${TZ}
    networks:
      - blog-data
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  # -------------------------------------------------------------------------
  # Frontend — React construido y servido como estatico (Task/006 + Task/007).
  #
  # El contenedor es un detalle del entorno LOCAL. En produccion el mismo
  # `dist/` lo publica Cloudflare Pages, sin contenedor (ADR-003).
  #
  # VITE_API_BASE_URL y VITE_SITE_BASE_URL se pasan como argumentos de BUILD
  # porque Vite incrusta las variables `VITE_*` en el bundle: cambiarlas exige
  # reconstruir la imagen.
  #
  # En local las dos apuntan al MISMO origen, el que publica Traefik: asi el
  # navegador trata las peticiones como same-origin y no hace falta CORS. Que
  # coincidan es una propiedad del entorno local, no una equivalencia: son
  # conceptos distintos y en produccion difieren (D-15).
  # -------------------------------------------------------------------------
  frontend:
    build:
      context: ${FRONTEND_CONTEXT:-../personal-blog-frontend}
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:${TRAEFIK_HTTP_HOST_PORT}
        # Origen publico del SITIO, anadido por `Task/016`. Se pasa aqui —y no
        # se deja al valor por defecto del Dockerfile— porque
        # `TRAEFIK_HTTP_HOST_PORT` es configurable: `canonical`, `og:url` y
        # `og:image` no pueden quedar acoplados a un puerto fijo.
        #
        # En local coincide con el origen del API porque Traefik enruta por
        # prefijo de ruta y sirve sitio y API en el mismo origen. En produccion
        # NO coinciden (D-15) y el valor lo fijan `Task/034` y `Task/035`.
        VITE_SITE_BASE_URL: http://localhost:${TRAEFIK_HTTP_HOST_PORT}
    image: personal-blog-frontend:local
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-frontend
    restart: unless-stopped
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    environment:
      TZ: ${TZ}
    networks:
      # Solo la red de borde: el frontend no tiene —ni debe tener— acceso a
      # PostgreSQL ni a MinIO. Sus datos llegan siempre por el API.
      - blog-edge
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 15s

  # -------------------------------------------------------------------------
  # Traefik v3 — reverse proxy local (D-05, resuelta en Task/003).
  #
  # Es la UNICA puerta de entrada publicada del conjunto de aplicaciones.
  #
  # SIN acceso al socket de Docker, a proposito. El descubrimiento por
  # etiquetas exigiria montarlo, y eso daria a un tercer componente capacidad
  # administrativa sobre el host —junto a Portainer (R-09) y al futuro emulador
  # de `Task/025` (R-22)—. Con dos rutas estables no compensa: el enrutado se
  # declara en docker/traefik/dynamic/routes.yml.
  #
  # Traefik NO es Cloudflare ni API Gateway: es su equivalente local.
  # -------------------------------------------------------------------------
  traefik:
    build:
      context: ./docker/traefik
      args:
        TRAEFIK_IMAGE: traefik:${TRAEFIK_VERSION}
    image: personal-blog-traefik:local
    container_name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-traefik
    restart: unless-stopped
    user: "65532:65532"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    ports:
      - "${LOCAL_BIND_ADDRESS}:${TRAEFIK_HTTP_HOST_PORT}:8080"
    volumes:
      # Solo lectura: Traefik no escribe su configuracion.
      - ./docker/traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./docker/traefik/dynamic:/etc/traefik/dynamic:ro
    environment:
      TZ: ${TZ}
    networks:
      # Solo la red de borde: Traefik no alcanza PostgreSQL ni MinIO, y no
      # tiene ningun motivo para hacerlo.
      - blog-edge
    depends_on:
      # Ambos por salud, no por arranque: los dos exponen sonda propia, asi que
      # esperar solo a que el proceso exista dejaria a Traefik enrutando hacia
      # un servicio que todavia no responde.
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      # `traefik healthcheck` viene en la imagen y consulta el ping interno.
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

# ---------------------------------------------------------------------------
# Redes
# ---------------------------------------------------------------------------
networks:
  # Datos del blog: PostgreSQL, MinIO y —desde Task/007— el backend.
  # Ni el frontend ni Traefik se unen a ella: no tienen credenciales de base de
  # datos ni motivo para alcanzar el almacenamiento
  # (security-boundaries.md, seccion 3).
  blog-data:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-data
    driver: bridge

  # Borde HTTP (Task/007): Traefik, frontend y backend. Es la frontera por la
  # que entra el trafico del navegador. Se mantiene separada de blog-data para
  # que el backend siga siendo el unico servicio con un pie en cada lado: es
  # justo el papel que tendra la Lambda en produccion.
  blog-edge:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-edge
    driver: bridge

  # Herramientas de infraestructura. Aislada de los datos a proposito: impide
  # que Portainer alcance PostgreSQL o MinIO por red. No limita lo que pueda
  # hacer sobre esos contenedores a traves del daemon de Docker.
  blog-management:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}-management
    driver: bridge

# ---------------------------------------------------------------------------
# Volumenes nombrados
#
# Los datos viven en volumenes gestionados por Docker, no en bind mounts:
# sobreviven a `docker compose down` y evitan los problemas de permisos y
# rendimiento de los bind mounts en Windows.
# `docker compose down -v` SI los elimina: ver el runbook antes de usarlo.
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}_postgres_data
  minio_data:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}_minio_data
  portainer_data:
    name: ${COMPOSE_PROJECT_NAME:-personal-blog-local}_portainer_data

  # Areas de PASO del runbook de respaldo (`Task/018`). No guardan estado del
  # producto: el script de respaldo borra su contenido al terminar. Existen
  # porque `docker cp` no puede leer de un tmpfs, y los servicios endurecidos
  # ya no tienen sistema de archivos raiz escribible.
  postgres_backup:
