# Configuracion de Gitleaks del proyecto.
#
# EXTIENDE la configuracion por defecto; no la sustituye. Todas las reglas de
# Gitleaks siguen activas.
#
# Unica excepcion, anadida en Task/028: las lineas de `go.sum` que viajan dentro
# de los parches del derivado reproducible de MinIO
# (`docker/minio/*-deps-*.patch`). Esas lineas son **sumas de comprobacion de
# modulos Go** en formato dirhash —`h1:` seguido del Base64 de 32 bytes—, y
# `generic-api-key` las marca cuando la ruta del modulo contiene `auth`,
# `oauth2` o `api`:
#
#   cloud.google.com/go/auth v0.16.0 h1:...=
#   golang.org/x/oauth2 v0.36.0 h1:...=
#   google.golang.org/api v0.230.0 h1:...=
#
# No son credenciales: son hashes del arbol de cada modulo, **publicados de
# forma publica** en `sum.golang.org`, y su proposito es exactamente el
# contrario al de un secreto —permitir que cualquiera verifique el modulo—. Sin
# ellos el build no podria ejecutar `go mod verify`.
#
# Por que asi y no de otra forma:
#
#   - NO se desactiva `generic-api-key` ni ninguna otra regla.
#   - NO se exceptua ninguna ruta ni ningun archivo completo: la excepcion es
#     por FORMA DE LINEA, de modo que cualquier otro contenido de esos mismos
#     parches sigue analizandose.
#   - NO se usa `.gitleaksignore` con huellas: una huella lleva dentro el SHA
#     del commit y deja de aplicar en cuanto el commit cambia, asi que oculta
#     mas de lo que declara.
#
# El patron exige la gramatica completa de una entrada de `go.sum`: ruta de
# modulo, version semantica, el sufijo opcional `/go.mod`, y un Base64 de
# longitud exacta. Un secreto no puede pasar por aqui sin adoptar esa forma
# entera.

[extend]
useDefault = true

[[allowlists]]
description = "Sumas de comprobacion de modulos Go (go.sum), publicas por diseno"
regexTarget = "line"
regexes = [
  '''^[+\- ]?[a-z0-9.\-]+\.[a-z]{2,}(/[^\s@]+)* v[0-9]+\.[0-9]+\.[0-9]+[^\s]*(/go\.mod)? h1:[A-Za-z0-9+/]{43}=$''',
]
